<div
  class="xp-saver"
  role="button"
  tabindex="0"
  [attr.aria-label]="'common.actions.clickToStart' | translate"
  matRipple
  [matRippleColor]="'rgba(255,255,255,0.24)'"
  (click)="enterLoginOrDesktop()"
  (keydown.enter)="enterLoginOrDesktop()"
  (keydown.space)="$event.preventDefault(); enterLoginOrDesktop()"
>
  <div class="scanlines"></div>

  <div class="boot-content">
    <img
      class="boot-logo"
      ngSrc="/assets/images/system/logo_xp.webp"
      [attr.alt]="'common.logoAlt' | translate"
      width="220"
      height="207"
      priority
    />

    <h1 class="boot-title">{{ 'app.name' | translate }}</h1>
    <p class="boot-hint">{{ 'common.actions.clickToStart' | translate }}</p>
  </div>

  @if (booting()) {
    <mat-progress-bar class="xp-progress" mode="indeterminate"></mat-progress-bar>
  }
</div>
