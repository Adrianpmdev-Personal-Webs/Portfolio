<mat-menu
  #startMenu="matMenu"
  xPosition="after"
  yPosition="above"
  class="xp-start-menu-panel"
  (closed)="closeAllPrograms()"
>
  <div class="xp-start-menu">
    <div class="xp-start-menu__header">
      <div class="xp-start-menu__avatar">
        <img
          src="/assets/images/system/avatar_xp.webp"
          [attr.alt]="'common.avatarAlt' | translate"
        />
      </div>

      <div class="xp-start-menu__name">
        {{ userName() || ('login.form.nameLabel' | translate) | titlecase }}
      </div>
    </div>

    <div class="xp-start-menu__body">
      <div
        class="xp-start-menu__left"
        [class.xp-start-menu__left--hidden-responsive]="isAllProgramsOpen()"
      >
        @for (app of apps(); track app.id) {
          <button class="xp-start-item" type="button" (click)="appLaunch.emit(app)">
            <img [src]="app.iconSrc" [attr.alt]="app.titleKey | translate" />

            <span>
              {{ app.titleKey | translate }}
            </span>
          </button>
        }

        <div class="xp-start-menu__left-sep"></div>

        <button
          class="xp-start-all-programs"
          type="button"
          (click)="$event.stopPropagation(); openAllPrograms()"
        >
          <span>
            {{ 'common.startMenu.allPrograms' | translate }}
          </span>

          <span class="xp-start-all-programs__arrow" aria-hidden="true"></span>
        </button>
      </div>

      <div
        class="xp-start-menu__right"
        [class.xp-start-menu__right--visible-responsive]="isAllProgramsOpen()"
      >
        <button
          class="xp-right-back"
          type="button"
          (click)="$event.stopPropagation(); closeAllPrograms()"
        >
          <span class="xp-right-back__arrow" aria-hidden="true"></span>

          <span>
            {{ 'common.startMenu.back' | translate }}
          </span>
        </button>

        <div class="xp-right-sep"></div>

        <button class="xp-right-item" type="button" (click)="launchAppById('my-pc')">
          {{ 'common.startMenu.myComputer' | translate }}
        </button>

        <button class="xp-right-item" type="button" (click)="launchAppById('photo-viewer')">
          {{ 'common.startMenu.myPictures' | translate }}
        </button>

        <button class="xp-right-item" type="button" (click)="launchAppById('internet-explorer')">
          {{ 'common.startMenu.internet' | translate }}
        </button>

        <div class="xp-right-sep"></div>

        <button class="xp-right-item" type="button" (click)="openUrl('mailto:' + profile.email)">
          {{ 'common.startMenu.helpSupport' | translate }}
        </button>

        <button class="xp-right-item" type="button" (click)="openUrl(profile.linkedinUrl)">
          {{ 'common.startMenu.search' | translate }}
        </button>

        <button class="xp-right-item" type="button">
          {{ 'common.startMenu.run' | translate }}
        </button>
      </div>
    </div>

    <div class="xp-start-menu__footer">
      <button class="xp-power-btn xp-power-btn--logout" type="button" (click)="logout.emit()">
        <span class="xp-power-btn__icon-box" aria-hidden="true">
          <span class="xp-power-btn__icon-text xp-power-btn__logout-icon"></span>
        </span>

        <span class="xp-power-btn__label">
          {{ 'common.actions.logout' | translate }}
        </span>
      </button>

      <button class="xp-power-btn xp-power-btn--off" type="button" (click)="turnOff.emit()">
        <span class="xp-power-btn__icon-box" aria-hidden="true">
          <span class="xp-power-btn__icon-text xp-power-btn__power-icon"></span>
        </span>

        <span class="xp-power-btn__label">
          {{ 'common.actions.turnOffComputer' | translate }}
        </span>
      </button>
    </div>
  </div>
</mat-menu>
