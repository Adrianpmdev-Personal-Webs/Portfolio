<nav class="xp-taskbar" [attr.aria-label]="'common.taskbar' | translate">
  <button
    class="xp-start"
    mat-button
    type="button"
    [matMenuTriggerFor]="startMenu.menu()"
    [attr.aria-label]="'common.actions.start' | translate"
  >
    <img
      class="xp-start__logo"
      src="/assets/images/system/logo_xp.webp"
      alt=""
    />

    <span class="xp-start__text">
      {{ 'common.actions.start' | translate }}
    </span>

    <span class="xp-start__right-cap" aria-hidden="true"></span>
  </button>

  <div class="xp-main">
    <div class="xp-tabs">
      @for (win of windows(); track win.id) {
        <button
          type="button"
          class="xp-tab"
          [class.xp-tab--active]="win.active && win.state === 'open'"
          [class.xp-tab--minimized]="win.state === 'minimized'"
          (click)="windowTabClick.emit(win.id)"
        >
          {{ win.app.titleKey | translate }}
        </button>
      }
    </div>

    <div class="xp-main__fill"></div>

    <button
      class="xp-lang"
      mat-button
      type="button"
      [matMenuTriggerFor]="langMenu"
      [attr.aria-label]="'common.actions.language' | translate"
    >
      {{ currentLang() | uppercase }}
    </button>
  </div>

  <div
    class="xp-tray"
    role="status"
    [attr.aria-label]="'common.status.time' | translate"
  >
    <span class="xp-clock">{{ time }}</span>
  </div>
</nav>

<app-start-menu
  #startMenu
  [apps]="apps()"
  [userName]="userName()"
  (appLaunch)="appLaunch.emit($event)"
  (logout)="logout.emit()"
  (turnOff)="turnOff.emit()"
/>

<mat-menu
  #langMenu="matMenu"
  xPosition="before"
  yPosition="above"
  class="xp-lang-menu-panel"
>
  @for (lang of languages; track lang) {
    <button
      mat-menu-item
      type="button"
      (click)="setLang(lang)"
    >
      <img
        class="xp-flag"
        [src]="'/assets/images/flags/' + lang + '.svg'"
        alt=""
      />

      <span>
        {{ 'common.languages.' + lang | translate }}
      </span>
    </button>
  }
</mat-menu>
